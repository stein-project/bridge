[package]
name = "stein-quic-ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MPL-2.0"
publish = false
description = "The shared library the Stein Bridge loads for the Stein Sync QUIC transport: a C ABI over stein-quic, called through Java's foreign function API."

[lib]
name = "stein_quic"
crate-type = ["cdylib"]

[dependencies]
stein-quic = { path = "../stein-quic" }
tokio = { version = "1.54", features = ["rt-multi-thread", "time"] }
tracing = "0.1"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "warn"
