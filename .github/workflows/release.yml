# Builds a Bridge version and keeps the files (steinbridge.jar, LICENSE, NOTICE, the third-party licences, SHA256SUMS)
# as a workflow artifact. It publishes nothing: the Bridge is an internal component, and players get it inside the
# installer, whose release workflow (Stein-Project/installer) builds it from source and publishes the pack to the
# public distribution repository Stein-Project/stein-loader.
#
# Triggers: a v<version> tag (the tag must match SteinBridge.VERSION: it marks the commit of that version, and a
# mismatch fails the run) or by hand (Actions > release > Run workflow). Both do the same: build, check, artifact.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: bridge
      # The readable-name tools come from the SDK, next to this repository. With the SDK_DEPLOY_KEY secret (a private
      # sdk) it is cloned over SSH; without it (a fork's pull request, or a public sdk) ssh-key is empty and
      # actions/checkout falls back to HTTPS with the workflow token, which reads a public repository.
      - uses: actions/checkout@v4
        with:
          repository: Stein-Project/sdk
          path: sdk
          ssh-key: ${{ secrets.SDK_DEPLOY_KEY }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        id: version
        working-directory: bridge
        run: |
          v=$(sed -n 's/.*String VERSION = "\([^"]*\)".*/\1/p' src/main/java/dev/xavier/stein/bridge/SteinBridge.java)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$v" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match SteinBridge.VERSION $v"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Minecraft 1.8.9
        working-directory: bridge
        run: ./gradlew fetchMinecraft
      - name: Build and check
        working-directory: bridge
        run: ./gradlew build -Pstein.mcDir=build/mc
      - name: Files
        run: |
          mkdir dist
          # The licence and the third-party notices go with the jar (release assets are flat files).
          cp bridge/build/libs/steinbridge.jar bridge/LICENSE bridge/NOTICE bridge/licenses/* dist/
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: stein-bridge-${{ steps.version.outputs.version }}
          path: dist/
